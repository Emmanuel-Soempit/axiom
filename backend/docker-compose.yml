version: '3.8'

services:
  db:
    image: postgres:16
    container_name: eac_app_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eac_app_db
    ports:
      - "5432:5432"
    volumes:
      - eac_app_db_data:/var/lib/postgresql/data

volumes:
  eac_app_db_data:
