version: '3.8'
services:


  frontend:
    build: ./frontend
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0

  web-app:
    build: ./web-app
    environment:
      - PORT=3001
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_FRONTEND_URL=http://frontend:3000
      - INTERNAL_API_URL=http://backend:3333
    ports:
      - "0.0.0.0:3001:3001"


  backend:
    build: ./backend
    depends_on:
      - postgres
    ports:
      - "0.0.0.0:3333:3333"
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/db?sslmode=disable"
      

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
