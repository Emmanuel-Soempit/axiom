apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
- ../../base

namespace: eac-staging

replicas:
- name: eac-backend
  count: 2
- name: eac-web-app
  count: 2
- name: eac-frontend
  count: 2
- name: eac-postgres
  count: 1

images:
- name: ghcr.io/emmanuel-soempit/eac-backend
  newTag: staging
- name: ghcr.io/emmanuel-soempit/eac-web-app
  newTag: staging
- name: ghcr.io/emmanuel-soempit/eac-frontend
  newTag: staging

resources:
- secrets/sealed-secrets.yaml
- secrets/configmap.yaml
- ingress.yaml
