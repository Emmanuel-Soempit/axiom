apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eac-ingress
  namespace: eac-staging
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - staging.soempit.com
    - portal.staging.soempit.com
    - api.staging.soempit.com
    secretName: eac-staging-tls
  rules:
  - host: staging.soempit.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: eac-frontend
            port:
              number: 3000
  - host: portal.staging.soempit.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: eac-web-app
            port:
              number: 3001
  - host: api.staging.soempit.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: eac-backend
            port:
              number: 3333
