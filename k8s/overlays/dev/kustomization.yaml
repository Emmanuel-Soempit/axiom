apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
- ../../base

namespace: eac-dev

replicas:
- name: eac-backend
  count: 1
- name: eac-web-app
  count: 1
- name: eac-frontend
  count: 1
- name: eac-postgres
  count: 1

images:
- name: ghcr.io/emmanuel-soempit/eac-backend
  newTag: develop
- name: ghcr.io/emmanuel-soempit/eac-web-app
  newTag: develop
- name: ghcr.io/emmanuel-soempit/eac-frontend
  newTag: develop

resources:
- secrets/secrets.yaml
- ../../ingress/dev-ingress.yaml
