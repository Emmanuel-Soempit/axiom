apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
- ../../base

namespace: axiom-prod

replicas:
- name: axiom-backend
  count: 3
- name: axiom-web-app
  count: 2
- name: axiom-frontend
  count: 2

images:
- name: ghcr.io/emmanuel-soempit/axiom-backend
  newTag: latest
- name: ghcr.io/emmanuel-soempit/axiom-web-app
  newTag: latest
- name: ghcr.io/emmanuel-soempit/axiom-frontend
  newTag: latest

resources:
- secrets/sealed-secrets.yaml
- secrets/configmap.yaml
- ingress.yaml

# Production: remove in-cluster postgres — use managed DB (RDS, Supabase, etc.)
patches:
- patch: |-
    $patch: delete
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: axiom-postgres
- patch: |-
    $patch: delete
    apiVersion: v1
    kind: Service
    metadata:
      name: axiom-postgres
- patch: |-
    $patch: delete
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: postgres-pvc
