apiVersion: apps/v1
kind: Deployment
metadata:
  name: eac-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eac-postgres
  template:
    metadata:
      labels:
        app: eac-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: db
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: eac-secrets
              key: postgres_password
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres"]
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: postgres-data
        hostPath:
          path: /var/lib/eac/postgres
          type: DirectoryOrCreate
