apiVersion: apps/v1
kind: Deployment
metadata:
  name: eac-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eac-backend
  template:
    metadata:
      labels:
        app: eac-backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/Chigirlat/eac-backend:latest  # set per overlay
        ports:
        - containerPort: 3333
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: eac-secrets
              key: database_url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: eac-secrets
              key: jwt_secret
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: eac-secrets
              key: groq_api_key
        - name: GROQ_API_URL
          valueFrom:
            configMapKeyRef:
              name: eac-config
              key: groq_api_url
        readinessProbe:
          httpGet:
            path: /health-check
            port: 3333
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"