apiVersion: apps/v1
kind: Deployment
metadata:
  name: eac-web-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eac-web-app
  template:
    metadata:
      labels:
        app: eac-web-app
    spec:
      containers:
      - name: web-app
        image: ghcr.io/Chigirlat/eac-web-app:latest
        ports:
        - containerPort: 3001
        env:
        - name: PORT
          value: "3001"
        - name: HOSTNAME
          value: "0.0.0.0"
        - name: INTERNAL_API_URL
          value: "http://eac-backend:3333"
        - name: NEXT_PUBLIC_FRONTEND_URL
          valueFrom:
            configMapKeyRef:
              name: eac-config
              key: frontend_url
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "400m"
