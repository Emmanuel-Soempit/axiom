apiVersion: apps/v1
kind: Deployment
metadata:
  name: axiom-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: axiom-frontend
  template:
    metadata:
      labels:
        app: axiom-frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/emmanuel-soempit/axiom-frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: HOSTNAME
          value: "0.0.0.0"
        - name: NEXT_PUBLIC_FRONTEND_URL
          valueFrom:
            configMapKeyRef:
              name: axiom-config
              key: frontend_url
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
