<!doctype html>

<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Sign Up | Embedded Agent Controller (EAC)</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#1919e6",
              "background-light": "#0f172a",
              "background-dark": "#0f172a",
            },
            fontFamily: {
              display: ["Inter"],
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #0f172a;
      }
    </style>
  </head>
  <body
    class="bg-background-light text-slate-100 font-display selection:bg-primary selection:text-white"
  >
    <div
      class="relative min-h-screen w-full flex flex-col items-center justify-center overflow-hidden px-4 py-12"
    >
      <!-- Abstract background elements for technical feel -->
      <div
        class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10 opacity-20"
      >
        <div
          class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/30 rounded-full blur-[120px]"
        ></div>
        <div
          class="absolute bottom-[-10%] right-[-10%] w-[30%] h-[30%] bg-blue-500/20 rounded-full blur-[100px]"
        ></div>
      </div>
      <!-- Navigation / Logo -->
      <div class="mb-10 flex items-center gap-3">
        <div
          class="size-10 bg-primary flex items-center justify-center rounded-lg shadow-lg shadow-primary/20"
        >
          <svg
            class="text-white w-6 h-6"
            fill="none"
            viewbox="0 0 48 48"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              clip-rule="evenodd"
              d="M47.2426 24L24 47.2426L0.757355 24L24 0.757355L47.2426 24ZM12.2426 21H35.7574L24 9.24264L12.2426 21Z"
              fill="currentColor"
              fill-rule="evenodd"
            ></path>
          </svg>
        </div>
        <span class="text-xl font-bold tracking-tight text-white uppercase"
          >EAC</span
        >
      </div>
      <!-- Sign Up Card -->
      <div
        class="w-full max-w-[480px] bg-slate-900/50 backdrop-blur-xl border border-slate-800 p-8 md:p-10 rounded-xl shadow-2xl"
      >
        <div class="text-center mb-8">
          <h1 class="text-3xl font-bold text-white mb-2">Build with EAC</h1>
          <p class="text-slate-400 text-sm">
            Deploy and manage autonomous agents with enterprise-grade
            infrastructure.
          </p>
        </div>
        <form class="space-y-5">
          <!-- Full Name -->
          <div class="flex flex-col gap-2">
            <label
              class="text-xs font-semibold text-slate-400 uppercase tracking-wider"
              >Full Name</label
            >
            <div class="relative">
              <span
                class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-xl"
                >person</span
              >
              <input
                class="w-full pl-12 pr-4 py-3.5 bg-slate-950/50 border border-slate-700 rounded-lg text-white focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder:text-slate-600"
                placeholder="Alex Rivera"
                type="text"
              />
            </div>
          </div>
          <!-- Email -->
          <div class="flex flex-col gap-2">
            <label
              class="text-xs font-semibold text-slate-400 uppercase tracking-wider"
              >Work Email</label
            >
            <div class="relative">
              <span
                class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-xl"
                >mail</span
              >
              <input
                class="w-full pl-12 pr-4 py-3.5 bg-slate-950/50 border border-slate-700 rounded-lg text-white focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder:text-slate-600"
                placeholder="alex@company.com"
                type="email"
              />
            </div>
          </div>
          <!-- Password -->
          <div class="flex flex-col gap-2">
            <label
              class="text-xs font-semibold text-slate-400 uppercase tracking-wider"
              >Password</label
            >
            <div class="relative">
              <span
                class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-xl"
                >lock</span
              >
              <input
                class="w-full pl-12 pr-4 py-3.5 bg-slate-950/50 border border-slate-700 rounded-lg text-white focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder:text-slate-600"
                placeholder="••••••••"
                type="password"
              />
            </div>
          </div>
          <!-- Primary CTA -->
          <button
            class="w-full py-4 bg-primary hover:bg-primary/90 text-white font-bold rounded-lg transition-colors shadow-lg shadow-primary/20 flex items-center justify-center gap-2 mt-4"
            type="submit"
          >
            Create Account
            <span class="material-symbols-outlined text-lg">arrow_forward</span>
          </button>
          <!-- Divider -->
          <div class="relative py-4">
            <div class="absolute inset-0 flex items-center">
              <div class="w-full border-t border-slate-800"></div>
            </div>
            <div class="relative flex justify-center text-xs uppercase">
              <span class="bg-slate-900/50 px-2 text-slate-500 font-medium"
                >Or continue with</span
              >
            </div>
          </div>
          <!-- Secondary Button (GitHub) -->
          <button
            class="w-full py-3.5 bg-slate-800 hover:bg-slate-700 text-white font-medium rounded-lg transition-all border border-slate-700 flex items-center justify-center gap-3"
            type="button"
          >
            <svg
              class="w-5 h-5 fill-current"
              viewbox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.041-1.412-4.041-1.412-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"
              ></path>
            </svg>
            <span>Sign up with GitHub</span>
          </button>
        </form>
        <!-- Footer Link -->
        <div class="mt-8 text-center">
          <p class="text-slate-400 text-sm">
            Already have an account?
            <a
              class="text-primary hover:text-blue-400 font-semibold transition-colors"
              href="#"
              >Sign In</a
            >
          </p>
        </div>
      </div>
      <!-- System Status Indicator -->
      <div
        class="mt-12 flex items-center gap-6 text-xs font-mono text-slate-500 uppercase tracking-widest"
      >
        <div class="flex items-center gap-2">
          <span class="size-2 bg-emerald-500 rounded-full animate-pulse"></span>
          <span>API Status: Normal</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="material-symbols-outlined text-sm">security</span>
          <span>SOC2 Type II Certified</span>
        </div>
      </div>
    </div>
  </body>
</html>
