<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#1919e6", // Electric Blue
              "background-light": "#f6f6f8",
              "background-dark": "#0f172a", // Midnight charcoal
            },
            fontFamily: {
              display: ["Inter"],
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
    <title>EAC - Developer Login</title>
  </head>
  <body
    class="bg-background-dark font-display text-slate-100 min-h-screen flex flex-col"
  >
    <div
      class="relative flex min-h-screen w-full flex-col bg-background-dark overflow-x-hidden"
    >
      <div class="layout-container flex h-full grow flex-col">
        <header class="flex items-center justify-between px-6 py-6 lg:px-12">
          <div class="flex items-center gap-3">
            <div class="size-8 text-primary">
              <svg
                fill="none"
                viewbox="0 0 48 48"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M42.4379 44C42.4379 44 36.0744 33.9038 41.1692 24C46.8624 12.9336 42.2078 4 42.2078 4L7.01134 4C7.01134 4 11.6577 12.932 5.96912 23.9969C0.876273 33.9029 7.27094 44 7.27094 44L42.4379 44Z"
                  fill="currentColor"
                ></path>
              </svg>
            </div>
            <h2
              class="text-slate-100 text-lg font-bold leading-tight tracking-tight uppercase"
            >
              EAC
            </h2>
          </div>
        </header>
        <main class="flex flex-1 items-center justify-center p-4">
          <div class="w-full max-w-[440px] space-y-8">
            <div class="text-center space-y-2">
              <h1 class="text-slate-100 text-3xl font-bold tracking-tight">
                System Access
              </h1>
              <p class="text-slate-400 text-sm">
                Embedded Agent Controller Infrastructure
              </p>
            </div>
            <div
              class="bg-slate-900/50 border border-slate-800 p-8 rounded-xl shadow-2xl backdrop-blur-sm"
            >
              <form class="space-y-6">
                <div class="space-y-2">
                  <label
                    class="text-slate-300 text-xs font-semibold uppercase tracking-wider"
                    >Developer Email</label
                  >
                  <div class="relative">
                    <span
                      class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xl"
                      >alternate_email</span
                    >
                    <input
                      class="w-full pl-10 pr-4 py-3 bg-slate-950 border border-slate-700 rounded-lg text-slate-100 focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-slate-600 outline-none"
                      placeholder="dev@axiom-node.io"
                      type="email"
                    />
                  </div>
                </div>
                <div class="space-y-2">
                  <div class="flex justify-between items-center">
                    <label
                      class="text-slate-300 text-xs font-semibold uppercase tracking-wider"
                      >Secure Token</label
                    >
                    <a
                      class="text-primary text-xs font-medium hover:underline"
                      href="#"
                      >Forgot?</a
                    >
                  </div>
                  <div class="relative">
                    <span
                      class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xl"
                      >lock</span
                    >
                    <input
                      class="w-full pl-10 pr-12 py-3 bg-slate-950 border border-slate-700 rounded-lg text-slate-100 focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-slate-600 outline-none"
                      placeholder="••••••••"
                      type="password"
                    />
                    <button
                      class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 transition-colors"
                      type="button"
                    >
                      <span class="material-symbols-outlined text-xl"
                        >visibility</span
                      >
                    </button>
                  </div>
                </div>
                <button
                  class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-3.5 rounded-lg shadow-lg shadow-primary/20 transition-all active:scale-[0.98]"
                  type="submit"
                >
                  Authenticate
                </button>
              </form>
              <div class="mt-8 pt-6 border-t border-slate-800 text-center">
                <p class="text-slate-400 text-sm">
                  New agent?
                  <a
                    class="text-primary font-semibold hover:underline ml-1"
                    href="#"
                    >Request Provisioning</a
                  >
                </p>
              </div>
            </div>
            <div
              class="flex justify-center items-center gap-6 text-slate-500 text-xs"
            >
              <span class="flex items-center gap-1">
                <span class="material-symbols-outlined text-sm">shield</span>
                Encrypted
              </span>
              <span class="flex items-center gap-1">
                <span class="material-symbols-outlined text-sm">dns</span>
                v4.2.0-stable
              </span>
              <span class="flex items-center gap-1">
                <span class="material-symbols-outlined text-sm">public</span>
                Global Mesh
              </span>
            </div>
          </div>
        </main>
        <footer class="py-8 px-6 text-center">
          <p
            class="text-slate-600 text-xs uppercase tracking-widest font-medium"
          >
            © 2024 Embedded Agent Controller • Infrastructure Division
          </p>
        </footer>
      </div>
      <div
        class="absolute top-0 right-0 w-full h-full pointer-events-none opacity-20 overflow-hidden -z-10"
      >
        <div
          class="absolute top-[-10%] right-[-10%] w-[50%] h-[50%] bg-primary/20 blur-[120px] rounded-full"
        ></div>
        <div
          class="absolute bottom-[-10%] left-[-10%] w-[40%] h-[40%] bg-slate-800/40 blur-[100px] rounded-full"
        ></div>
      </div>
    </div>
  </body>
</html>
